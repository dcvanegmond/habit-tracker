# Every merge to main is tested, built and deployed to staging.
# The steps live in deploy.yml.
name: Deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  staging:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      container: habit-tracker-staging
      domain: ${{ vars.STAGING_DOMAIN }}
      comment_on_pr: true
    secrets:
      ssh_key: ${{ secrets.STAGING_SSH_KEY }}
      known_hosts: ${{ secrets.STAGING_KNOWN_HOSTS }}
