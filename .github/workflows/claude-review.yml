# Step 3: every pull request gets an automatic Claude code review.
name: Claude – code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read the diff with `gh pr diff` and the PR with `gh pr view`.
            If the PR body says "Closes #N", read that issue with `gh issue view N` and check the
            change against its Acceptance criteria. Follow CLAUDE.md.

            Focus on, in this order:
            1. Acceptance criteria that are not met
            2. Bugs and unhandled edge cases
            3. Missing or weak tests
            4. Security problems (for example unescaped user input in innerHTML)
            Do not comment on style or formatting.

            Put each specific finding as an inline comment on the relevant line using
            mcp__github_inline_comment__create_inline_comment. Then post one summary comment
            with `gh pr comment` that starts with either "✅ Looks good to merge" or
            "⚠️ Changes suggested", followed by a short list of the findings.
            Do not mention @claude in your comments.
          claude_args: |
            --max-turns 25
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
